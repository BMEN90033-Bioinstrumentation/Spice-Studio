# Builds the bundled ngspice and the installers for macOS (arm64, x64) and Windows (x64); a pushed v* tag also puts them on a draft GitHub release.
# Signing is optional: with no secrets set, macOS builds are ad-hoc signed and Windows builds are unsigned.
# Auto-update (src/main/updater.ts) reads latest.yml / latest-mac.yml from the newest *published* release: publishing the draft
# is what rolls an update out. Unsigned macOS builds only announce it and link to the download page.
#   macOS:   MAC_CSC_LINK (base64 .p12 of a "Developer ID Application" cert) + MAC_CSC_KEY_PASSWORD,
#            notarisation: APPLE_ID + APPLE_APP_SPECIFIC_PASSWORD + APPLE_TEAM_ID
#   Windows: WIN_CSC_LINK (base64 .pfx) + WIN_CSC_KEY_PASSWORD
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

env:
  # ngspice source: same revision as the local ngspice-ngspice/ checkout (ngspice-47-201-g03ef19244).
  # Any ref works here, e.g. the release tag ngspice-47.
  NGSPICE_REPO: https://git.code.sf.net/p/ngspice/ngspice
  NGSPICE_REF: 03ef1924439029f7871b47c143939545748bd883

jobs:
  # one draft per tag, made before the builds: three jobs each creating it would leave three drafts
  draft:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - run: gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --draft --title "$GITHUB_REF_NAME" --verify-tag

  build:
    needs: draft
    if: ${{ !failure() && !cancelled() }} # still runs when draft is skipped (manual run)
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-15, target: mac } # arm64
          - { os: macos-15-intel, target: mac } # x64 (macos-13 is retired)
          - { os: windows-latest, target: win }
    runs-on: ${{ matrix.os }}
    steps:
      # keep LF endings on Windows: CRLF breaks the shell scripts and ngspice's autogen in MSYS2
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v7
        with:
          persist-credentials: false # this job's token can write releases: keep it out of .git/config, away from npm and build scripts

      # the ngspice build is ~10 min per job and only changes with the ref or the build scripts.
      # ponytail: keyed on scripts, not toolchain version; bump the key if a runner image change breaks a cached binary
      - name: Cache ngspice
        id: ngspice
        uses: actions/cache@v6
        with:
          path: vendor/ngspice
          key: ngspice-${{ runner.os }}-${{ runner.arch }}-${{ env.NGSPICE_REF }}-${{ hashFiles('scripts/build-ngspice*.sh', 'scripts/ngspice-notices.md') }}

      - name: Fetch ngspice source
        if: steps.ngspice.outputs.cache-hit != 'true'
        shell: bash
        run: |
          git clone --filter=blob:none --no-checkout "$NGSPICE_REPO" ngspice-ngspice
          git -C ngspice-ngspice checkout --quiet "$NGSPICE_REF"

      - name: Build tools (macOS)
        if: runner.os == 'macOS' && steps.ngspice.outputs.cache-hit != 'true'
        run: brew install autoconf automake libtool bison
      - name: Build tools (Windows)
        if: runner.os == 'Windows' && steps.ngspice.outputs.cache-hit != 'true'
        uses: msys2/setup-msys2@v2.33.0
        with:
          msystem: MINGW64
          update: true
          install: git make tar autoconf automake libtool bison flex mingw-w64-x86_64-gcc mingw-w64-x86_64-ntldd-git

      - name: Build ngspice
        if: runner.os != 'Windows' && steps.ngspice.outputs.cache-hit != 'true'
        run: bash scripts/build-ngspice.sh
      - name: Build ngspice (MSYS2)
        if: runner.os == 'Windows' && steps.ngspice.outputs.cache-hit != 'true'
        shell: msys2 {0}
        run: bash scripts/build-ngspice-win.sh

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npx tsc --noEmit

      - name: Package
        shell: bash
        env:
          MAC_CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          MAC_CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # an empty CSC_LINK makes electron-builder try (and fail) to import it: export only what's set
          case "${{ matrix.target }}" in
            mac) link=$MAC_CSC_LINK pass=$MAC_CSC_KEY_PASSWORD ;;
            win) link=$WIN_CSC_LINK pass=$WIN_CSC_KEY_PASSWORD ;;
            *) link= pass= ;;
          esac
          if [ -n "$link" ]; then export CSC_LINK=$link CSC_KEY_PASSWORD=$pass; fi
          npm run dist:${{ matrix.target }} -- --publish never

      # tag: straight onto the draft release. Release assets are not counted against the Actions artifact quota,
      # which one run (~600 MB) overfills.
      - name: Upload to the draft release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          # each mac job writes latest-mac.yml for its own arch: upload per arch, the feed job merges them
          if [ -f dist/latest-mac.yml ]; then mv dist/latest-mac.yml "dist/latest-mac-${{ runner.arch }}.yml"; fi
          gh release upload "$GITHUB_REF_NAME" dist/*.dmg dist/*.zip dist/*.exe dist/*.blockmap dist/latest*.yml --clobber

      # manual run: no release, so the installers are a one-day artifact
      - uses: actions/upload-artifact@v7
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        with:
          name: spice-studio-${{ matrix.os }}
          if-no-files-found: error
          retention-days: 1
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.exe

  # the updater wants one latest-mac.yml listing both arches (it picks the zip by "arm64" in the name)
  feed:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - run: |
          gh release download "$GITHUB_REF_NAME" -p 'latest-mac-*.yml'
          set -- latest-mac-*.yml
          [ $# = 2 ]
          entries() { sed -n '/^files:/,/^path:/{/^files:/d;/^path:/d;p;}' "$1"; }
          { sed -n '1,/^files:/p' "$1"; entries "$1"; entries "$2"; sed -n '/^path:/,$p' "$1"; } > latest-mac.yml
          cat latest-mac.yml
          gh release upload "$GITHUB_REF_NAME" latest-mac.yml --clobber
          for f; do gh release delete-asset "$GITHUB_REF_NAME" "$f" -y; done
