<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 400" width="1280" height="400" role="img" aria-labelledby="t d">
  <title id="t">Spice Studio</title>
  <desc id="d">Schematic capture and circuit simulation for ngspice</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbfdff"/>
      <stop offset="0.55" stop-color="#f2f6fa"/>
      <stop offset="1" stop-color="#e9eff6"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.22" cy="0.42" r="0.55">
      <stop offset="0" stop-color="#29b6f6" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#4fc3f7" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="fadeR" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset="0.35" stop-color="#fff" stop-opacity="1"/>
    </linearGradient>
    <mask id="scopeMask"><rect x="780" y="0" width="500" height="400" fill="url(#fadeR)"/></mask>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#0277bd" stroke-opacity="0.08" stroke-width="1"/>
    </pattern>
    <pattern id="dots" width="8" height="40" patternUnits="userSpaceOnUse">
      <circle cx="4" cy="20" r="0.9" fill="#0277bd" fill-opacity="0.16"/>
    </pattern>
    <filter id="glow" x="-10%" y="-30%" width="120%" height="160%"><feGaussianBlur stdDeviation="3"/></filter>
  </defs>

  <rect width="1280" height="400" rx="24" fill="url(#bg)"/>
  <rect width="1280" height="400" rx="24" fill="url(#halo)"/>

  <!-- oscilloscope screen on the right -->
  <g mask="url(#scopeMask)">
    <rect x="560" y="0" width="720" height="400" fill="url(#grid)"/>
    <rect x="560" y="0" width="720" height="400" fill="url(#dots)"/>
    <!-- square-wave drive -->
    <path d="M600 300H700V140H860V300H1020V140H1180V300H1280" fill="none" stroke="#0288d1" stroke-opacity="0.45" stroke-width="2"/>
    <!-- RC response -->
    <path d="M700 300C716 196 760 152 860 144C876 248 920 292 1020 296C1036 192 1080 148 1180 144C1196 248 1240 292 1280 296"
          fill="none" stroke="#ef6c00" stroke-width="7" stroke-opacity="0.35" filter="url(#glow)"/>
    <path d="M700 300C716 196 760 152 860 144C876 248 920 292 1020 296C1036 192 1080 148 1180 144C1196 248 1240 292 1280 296"
          fill="none" stroke="#ef6c00" stroke-width="3" stroke-linecap="round"/>
    <!-- sine -->
    <path d="M600 220C640 180 680 180 720 220S800 260 840 220S920 180 960 220S1040 260 1080 220S1160 180 1200 220S1260 250 1280 236"
          fill="none" stroke="#2e7d32" stroke-width="2.4" stroke-opacity="0.55"/>
    <!-- cursor -->
    <path d="M1108 40V360" stroke="#1b2430" stroke-opacity="0.3" stroke-width="1.5" stroke-dasharray="4 6"/>
    <circle cx="1108" cy="154" r="5" fill="#ef6c00"/>
    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" fill="#1b2430" fill-opacity="0.75">
      <text x="1120" y="58">V(out) 993mV</text>
      <text x="1120" y="80">t = 14.1ms</text>
    </g>
  </g>

  <!-- line-art schematic: source, resistor, capacitor -->
  <g transform="translate(-6 24)" fill="none" stroke="#3a4656" stroke-opacity="0.3" stroke-width="2" stroke-linejoin="round" stroke-linecap="round">
    <path d="M90 352V330M90 300V280H120l6-10 12 20 12-20 12 20 12-20 12 20 6-10H230V300M216 300H244M216 310H244M230 310V330M70 352H250"/>
    <circle cx="90" cy="315" r="15"/>
    <path d="M90 307V313M87 310H93M87 320H93"/>
  </g>

  <!-- brand mark (same artwork as build/icon.svg) -->
  <g transform="translate(96 108) scale(3.6) translate(-1 -1)">
    <rect x="1" y="1" width="46" height="46" rx="10.3" fill="#0b7fe6"/>
    <path d="M10 16h12q5 0 8 6l8 14" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- wordmark -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
    <text x="292" y="186" font-size="72" font-weight="700" fill="#14202c" letter-spacing="-1.5">Spice <tspan fill="#0288d1">Studio</tspan></text>
    <text x="294" y="232" font-size="24" fill="#4f5b6d">Schematic capture &amp; simulation for ngspice</text>
    <g font-size="15" font-weight="600" fill="#0277bd" fill-opacity="0.95" letter-spacing="1.5">
      <text x="294" y="276">SCHEMATICS&#160;&#183;&#160;HIERARCHY&#160;&#183;&#160;3,000+ PARTS&#160;&#183;&#160;SWEEPS</text>
    </g>
  </g>
</svg>
